<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift log</title>
<meta name="theme-color" content="#2a5e50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#edf0ee;--fg:#1b1f1e;--mut:#667;--card:#fff;--line:#d3d9d6;--acc:#2a5e50;--accfg:#fff;--in:#f4f6f5;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121615;--fg:#e8ece9;--mut:#98a09b;--card:#1c2120;--line:#2f3835;--acc:#74c0a6;--accfg:#0d1f19;--in:#141918;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121615;--fg:#e8ece9;--mut:#98a09b;--card:#1c2120;--line:#2f3835;--acc:#74c0a6;--accfg:#0d1f19;--in:#141918;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin-inline:auto;padding:12px 12px 90px}
h1{font-size:22px;margin:6px 2px 10px;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:44px;padding:0 12px;border-radius:10px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{border:1px solid var(--line);background:var(--card);white-space:nowrap;flex:0 0 auto}
.tabs button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.top button{font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:6px}
.nm{font-weight:650;font-size:17px;text-align:left;padding:0;flex:1;min-height:36px}
.mut{color:var(--mut);font-size:14px}
.x{color:var(--mut);padding:0 8px}
.row{display:grid;grid-template-columns:24px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px}
.row span{color:var(--mut);text-align:center}
input,textarea{font:inherit;color:inherit;background:var(--in);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
.row input{text-align:center}
.ck{border:1px solid var(--line);background:var(--in);font-size:20px}
.ck.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.add{color:var(--acc);font-weight:600}
.pri{background:var(--acc);color:var(--accfg);font-weight:650;width:100%;margin-top:4px}
.lbl{display:block;font-size:13px;color:var(--mut);margin:0 0 -4px 2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.ov>div{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ov .b{display:flex;gap:8px;margin-top:10px}
.ov .b button{flex:1;border:1px solid var(--line)}
.ov .b .pri{margin:0;border:0}
.his{padding:2px 0;font-size:15px}
textarea{min-height:160px;font:13px/1.3 ui-monospace,monospace}
select{font:inherit;color:inherit;background:var(--in);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
.tb{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:5}
.tb #tt{font-size:20px;font-weight:650;min-width:150px;font-variant-numeric:tabular-nums}
.tb button{border:1px solid var(--line);background:var(--in)}
.tb #tg{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:650}
</style></head><body>
<div id="app"></div>
<script>
var K='liftlog.v1';
var DEF={days:[
{f:'Upper A',n:'Heavier day: 5–8 reps on the first two lifts, 8–12 on the rest. Finish each exercise 1–3 reps short of failure.',ex:['Bench press','Barbell row','Overhead press','Lat pulldown','Triceps pushdown','Dumbbell curl']},
{f:'Lower A',n:'Quad focus: 5–8 reps on squat, 8–12 on the rest, 10–15 on calves.',ex:['Squat','Romanian deadlift','Leg press','Leg curl','Calf raise']},
{f:'Upper B',n:'Lighter day: 8–15 reps, controlled tempo, close to failure on the last set.',ex:['Incline dumbbell press','Dumbbell row','Lateral raise','Pull-up','Overhead triceps extension','Hammer curl']},
{f:'Lower B',n:'Glute and hamstring focus: 8–15 reps, close to failure on the last set.',ex:['Hip thrust','Walking lunge','Leg extension','Leg curl','Calf raise','Hanging leg raise']}],
sessions:[],drafts:{},day:0,tab:'w',v:2};
var LIB=['Bench press','Incline dumbbell press','Chest press machine','Cable fly','Pec deck','Dips','Triceps pushdown','Skull crusher','Overhead triceps extension','Barbell row','Dumbbell row','Lat pulldown','Pull-up','Seated cable row','Dumbbell curl','Barbell curl','Hammer curl','Squat','Front squat','Leg press','Romanian deadlift','Deadlift','Leg extension','Leg curl','Walking lunge','Calf raise','Hip thrust','Overhead press','Dumbbell shoulder press','Lateral raise','Rear delt fly','Face pull','Cable crunch','Plank','Hanging leg raise'];
var S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.days)S=JSON.parse(JSON.stringify(DEF));
if(S.v!==2){var oldS=S.sessions||[];S=JSON.parse(JSON.stringify(DEF));S.sessions=oldS}
var app=document.getElementById('app');
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function draft(d){
  if(!S.drafts[d])S.drafts[d]={items:S.days[d].ex.map(function(n){return {name:n,sets:[{w:'',r:'',d:0},{w:'',r:'',d:0},{w:'',r:'',d:0}]}})};
  return S.drafts[d];
}
function sync(d){S.days[d].ex=draft(d).items.map(function(i){return i.name});save()}
function last(name){
  for(var i=S.sessions.length-1;i>=0;i--){
    var it=S.sessions[i].items.filter(function(x){return x.name.toLowerCase()===name.toLowerCase()})[0];
    if(it)return it.sets;
  }return null;
}
function fmt(sets){return sets.map(function(s){return (s.w||'–')+'×'+(s.r||'–')}).join(', ')}
function names(){
  var o={};LIB.forEach(function(n){o[n]=1});
  S.days.forEach(function(d){d.ex.forEach(function(n){o[n]=1})});
  S.sessions.forEach(function(s){s.items.forEach(function(i){o[i.name]=1})});
  return Object.keys(o).sort();
}
function ask(title,val,sug,cb){
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div><b>'+esc(title)+'</b><input id="ai" list="dl" value="'+esc(val)+'" autocomplete="off" style="margin-top:8px">'+(sug?'<datalist id="dl">'+names().map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist>':'')+'<div class="b"><button id="ac">Cancel</button><button class="pri" id="as">Save</button></div></div>';
  document.body.appendChild(ov);
  var inp=ov.querySelector('#ai');inp.focus();inp.select();
  function done(ok){var v=inp.value.trim();ov.remove();if(ok&&v)cb(v)}
  ov.querySelector('#ac').onclick=function(){done(0)};
  ov.querySelector('#as').onclick=function(){done(1)};
  inp.onkeydown=function(e){if(e.key==='Enter')done(1)};
  ov.onclick=function(e){if(e.target===ov)done(0)};
}
function render(){
  var h='<h1>Lift log</h1><div class="tabs top">'+[['w','Workout'],['g','Program'],['p','Progress'],['h','History'],['b','Backup']].map(function(t){return '<button data-a="tab" data-v="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div>';
  if(S.tab==='w')h+=work();else if(S.tab==='g')h+=pick();else if(S.tab==='p')h+=prog();else if(S.tab==='h')h+=hist();else h+=bak();
  app.innerHTML=h;tick();
}
function work(){
  var d=S.day,dr=draft(d);
  var h='<div class="tabs">'+S.days.map(function(x,i){return '<button data-a="day" data-v="'+i+'" class="'+(i===d?'on':'')+'">'+(i+1)+'. '+esc(x.f)+'</button>'}).join('')+'</div>';
  h+='<div class="hd" style="margin:0 2px 8px"><span class="mut">Day '+(d+1)+' focus</span><button data-a="focus" class="add">Rename</button></div>'+(S.days[d].n?'<div class="mut" style="margin:-4px 2px 10px">'+esc(S.days[d].n)+'</div>':'');
  dr.items.forEach(function(it,i){
    var l=last(it.name);
    h+='<div class="card"><div class="hd"><button class="nm" data-a="swap" data-i="'+i+'">'+esc(it.name)+' <span class="mut">· change</span></button><button class="x" data-a="del" data-i="'+i+'" aria-label="Remove exercise">✕</button></div>';
    h+='<div class="mut">'+(l?'Last time: '+esc(fmt(l)):'No history yet')+'</div>';
    h+='<div class="row mut" style="margin-top:6px"><span></span><span>kg</span><span>reps</span><span></span></div>';
    it.sets.forEach(function(s,j){
      var p=l&&l[j]||l&&l[l.length-1]||{};
      h+='<div class="row"><span>'+(j+1)+'</span><input inputmode="decimal" data-i="'+i+'" data-s="'+j+'" data-k="w" value="'+esc(s.w)+'" placeholder="'+esc(p.w||'')+'" aria-label="Weight, set '+(j+1)+'"><input inputmode="numeric" data-i="'+i+'" data-s="'+j+'" data-k="r" value="'+esc(s.r)+'" placeholder="'+esc(p.r||'')+'" aria-label="Reps, set '+(j+1)+'"><button class="ck '+(s.d?'on':'')+'" data-a="ck" data-i="'+i+'" data-s="'+j+'" aria-label="Mark set done">✓</button></div>';
    });
    h+='<div style="display:flex;justify-content:space-between;margin-top:6px"><button class="add" data-a="aset" data-i="'+i+'">+ Set</button>'+(it.sets.length>1?'<button class="x" data-a="rset" data-i="'+i+'">Remove set</button>':'')+'</div></div>';
  });
  h+='<button class="add" data-a="addex" style="width:100%;border:1px dashed var(--line);margin-bottom:12px">+ Add exercise</button>';
  h+='<button class="pri" data-a="fin">Finish workout</button>';
  return h;
}
function hist(){
  if(!S.sessions.length)return '<div class="card mut">No workouts saved yet. Finish a workout and it shows up here.</div>';
  return S.sessions.slice().reverse().map(function(s){
    var idx=S.sessions.indexOf(s);
    return '<div class="card"><div class="hd"><b>'+esc(s.f)+'</b><button class="x" data-a="dels" data-v="'+idx+'" aria-label="Delete workout">✕</button></div><div class="mut">'+new Date(s.t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'</div>'+s.items.map(function(i){return '<div class="his"><b>'+esc(i.name)+'</b><br><span class="mut">'+esc(fmt(i.sets))+'</span></div>'}).join('')+'</div>';
  }).join('');
}
function bak(){
  return '<div class="card"><b>Back up your data</b><p class="mut">Copy this text and keep it somewhere safe (notes, email to yourself). To restore, paste it back and tap Import.</p><textarea id="bk">'+esc(JSON.stringify(S))+'</textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="pri" data-a="copy" style="margin:0">Copy</button><button class="pri" data-a="imp" style="margin:0">Import</button></div><div id="bm" class="mut" style="margin-top:8px"></div></div>';
}
app.addEventListener('input',function(e){
  var t=e.target;if(t.dataset.k===undefined)return;
  draft(S.day).items[t.dataset.i].sets[t.dataset.s][t.dataset.k]=t.value;save();
});
app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var a=b.dataset.a,d=S.day,dr=draft(d),i=+b.dataset.i,s=+b.dataset.s;
  if(a==='tab'){S.tab=b.dataset.v;cp=-1}
  else if(a==='day'){S.day=+b.dataset.v}
  else if(a==='focus'){return ask('Day '+(d+1)+' focus',S.days[d].f,0,function(v){S.days[d].f=v;save();render()})}
  else if(a==='swap'){return ask('Change exercise',dr.items[i].name,1,function(v){dr.items[i].name=v;sync(d);render()})}
  else if(a==='addex'){return ask('Add exercise','',1,function(v){dr.items.push({name:v,sets:[{w:'',r:'',d:0},{w:'',r:'',d:0},{w:'',r:'',d:0}]});sync(d);render()})}
  else if(a==='del'){dr.items.splice(i,1);sync(d)}
  else if(a==='ck'){var st=dr.items[i].sets[s];st.d=st.d?0:1;if(st.d){startRest();var l=last(dr.items[i].name),p=l&&l[s]||l&&l[l.length-1]||{};if(st.w==='')st.w=p.w||'';if(st.r==='')st.r=p.r||''}}
  else if(a==='aset'){var ss=dr.items[i].sets,pv=ss[ss.length-1];ss.push({w:pv?pv.w:'',r:pv?pv.r:'',d:0})}
  else if(a==='rset'){dr.items[i].sets.pop()}
  else if(a==='fin'){
    var items=dr.items.map(function(it){return {name:it.name,sets:it.sets.filter(function(x){return x.w!==''||x.r!==''}).map(function(x){return {w:x.w,r:x.r}})}}).filter(function(it){return it.sets.length});
    if(!items.length){return ask('Nothing to save yet. Enter at least one set first.','',0,function(){})}
    S.sessions.push({t:Date.now(),f:S.days[d].f,items:items});delete S.drafts[d];S.tab='h';
  }
  else if(a==='met'){S.metric=b.dataset.v}
  else if(a==='xapply'){applyX()}
  else if(a==='usep'){usePreset(+b.dataset.v)}
  else if(a==='dels'){S.sessions.splice(+b.dataset.v,1)}
  else if(a==='copy'){var ta=document.getElementById('bk');ta.select();var m=document.getElementById('bm');try{navigator.clipboard.writeText(ta.value).then(function(){m.textContent='Copied.'},function(){m.textContent='Select the text and copy it manually.'})}catch(x){m.textContent='Select the text and copy it manually.'}return}
  else if(a==='imp'){var m2=document.getElementById('bm');try{var n=JSON.parse(document.getElementById('bk').value);if(!n.days||!n.sessions)throw 0;S=n;S.tab='w';save()}catch(x){m2.textContent='That text is not a valid backup.';return}}
  save();render();window.scrollTo(0,0);
});
var tb=document.createElement('div');tb.className='tb';
tb.innerHTML='<button data-t="edit" id="tt"></button><button data-t="go" id="tg"></button>';
document.body.appendChild(tb);
var tt=tb.querySelector('#tt'),tg=tb.querySelector('#tg'),tEnd=0;
if(!S.rest)S.rest=90;

function buzz(){try{if(navigator.vibrate)navigator.vibrate([250,120,250])}catch(e){}}
function startRest(){tEnd=Date.now()+S.rest*1000;tick()}
function mmss(n){return Math.floor(n/60)+':'+('0'+n%60).slice(-2)}
function tick(){
  tb.style.display=S.tab==='w'?'flex':'none';
  var left=tEnd?Math.ceil((tEnd-Date.now())/1000):0;
  if(tEnd&&left<=0){tEnd=0;left=0;buzz()}
  tt.textContent='Rest '+mmss(left||S.rest)+' ✎';
  tg.textContent=left?'Stop':'Start';
}
setInterval(tick,500);
tb.onclick=function(e){
  var b=e.target.closest('button');if(!b)return;var t=b.dataset.t;
  if(t==='edit'){ask('Rest time (seconds or m:ss)',mmss(S.rest),0,function(v){var m=v.match(/^(\d+):(\d{1,2})$/),n=m?+m[1]*60+ +m[2]:parseInt(v,10);if(n>0&&n<=3600){S.rest=n;if(tEnd)tEnd=Date.now()+n*1000;save();tick()}});return}
  if(t==='go'){if(tEnd)tEnd=0;else startRest()}
  save();tick();
};
function num(x){return parseFloat(String(x).replace(',','.'))||0}
function series(name,m){return S.sessions.map(function(s){
  var it=s.items.filter(function(x){return x.name===name})[0];if(!it)return null;var v=0;
  it.sets.forEach(function(x){var w=num(x.w),r=num(x.r);if(m==='vol')v+=w*r;else if(m==='top')v=Math.max(v,w);else if(w&&r)v=Math.max(v,w*(1+r/30))});
  return v?{t:s.t,v:Math.round(v*10)/10}:null}).filter(Boolean)}
function dt(t){return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'})}
function chart(p){
  var W=320,H=170,L=40,R=12,T=10,B=26,vs=p.map(function(x){return x.v}),lo=Math.min.apply(0,vs),hi=Math.max.apply(0,vs),mn=lo,mx=hi;
  if(mx===mn){mx+=1;mn-=1}
  var pad=(mx-mn)*.12;mn-=pad;mx+=pad;
  function X(i){return L+i*(W-L-R)/(p.length-1)}
  function Y(v){return T+(mx-v)*(H-T-B)/(mx-mn)}
  var tx='style="fill:var(--mut);font-size:10px"';
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img" aria-label="Progress chart">';
  [lo,hi].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" style="stroke:var(--line)"/><text x="'+(L-5)+'" y="'+(Y(v)+3)+'" text-anchor="end" '+tx+'>'+Math.round(v)+'</text>'});
  s+='<polyline points="'+p.map(function(x,i){return X(i)+','+Y(x.v)}).join(' ')+'" style="fill:none;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round"/>';
  p.forEach(function(x,i){s+='<circle cx="'+X(i)+'" cy="'+Y(x.v)+'" r="3.5" style="fill:var(--acc)"/>'});
  s+='<text x="'+L+'" y="'+(H-8)+'" '+tx+'>'+dt(p[0].t)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" '+tx+'>'+dt(p[p.length-1].t)+'</text></svg>';
  return s;
}
function prog(){
  var o={};S.sessions.forEach(function(s){s.items.forEach(function(i){o[i.name]=1})});
  var ex=Object.keys(o).sort();
  if(!ex.length)return '<div class="card mut">Charts appear after you save your first workout.</div>';
  if(ex.indexOf(S.pex)<0)S.pex=ex[0];
  var m=S.metric||'e1',p=series(S.pex,m),u=m==='vol'?'kg total':'kg';
  var h='<div class="card"><label class="lbl" for="pe">Exercise</label><select id="pe" style="margin-top:6px">'+ex.map(function(n){return '<option'+(n===S.pex?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>';
  h+='<div class="tabs" style="margin:10px 0">'+[['e1','Est. 1RM'],['top','Top weight'],['vol','Volume']].map(function(t){return '<button data-a="met" data-v="'+t[0]+'" class="'+(m===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div>';
  if(p.length<2){h+='<div class="mut">Log this exercise in at least two workouts to see a trend.</div>'+(p.length?'<p>Latest: '+p[0].v+' '+u+'</p>':'')}
  else{
    var f=p[0].v,l=p[p.length-1].v,df=Math.round((l-f)*10)/10,best=Math.max.apply(0,p.map(function(x){return x.v}));
    h+=chart(p)+'<p style="margin:8px 0 0">'+f+' → '+l+' '+u+' ('+(df>0?'+':'')+df+')<br><span class="mut">Best: '+best+' '+u+' in '+p.length+' workouts</span></p>';
  }
  if(m==='e1')h+='<p class="mut" style="margin:8px 0 0;font-size:13px">Estimated 1RM uses the Epley formula on your best set. It is least reliable above about 12 reps.</p>';
  return h+'</div>';
}
var cp=-1,PROGS=[
{t:'Upper/Lower · 4 days a week',d:'Each muscle twice a week. A days heavier, B days lighter. The best-supported fit for four sessions.',days:DEF.days},
{t:'Full body · 3 days a week',d:'Whole body every session. Good if you sometimes miss a day.',days:[
{f:'Full body A',n:'6–10 reps on the main lifts, 10–15 on the rest.',ex:['Squat','Bench press','Barbell row','Lateral raise','Triceps pushdown','Calf raise']},
{f:'Full body B',n:'6–10 reps on the main lifts, 10–15 on the rest.',ex:['Romanian deadlift','Overhead press','Lat pulldown','Incline dumbbell press','Dumbbell curl','Hanging leg raise']},
{f:'Full body C',n:'8–12 reps, controlled tempo.',ex:['Leg press','Dumbbell shoulder press','Seated cable row','Cable fly','Leg curl','Overhead triceps extension']}]},
{t:'Push/Pull/Legs · 3 days a week',d:'Pushing, pulling and legs on separate days. Run it twice a week for six days.',days:[
{f:'Push',n:'6–10 reps on presses, 10–15 on isolation.',ex:['Bench press','Overhead press','Incline dumbbell press','Lateral raise','Triceps pushdown']},
{f:'Pull',n:'6–10 reps on rows and pulldowns, 10–15 on the rest.',ex:['Barbell row','Lat pulldown','Seated cable row','Face pull','Dumbbell curl']},
{f:'Legs',n:'6–10 reps on squat, 8–12 on the rest, 10–15 on calves.',ex:['Squat','Romanian deadlift','Leg press','Leg curl','Calf raise']}]}
];
function usePreset(i){
  if(cp!==i){cp=i;return}
  S.days=JSON.parse(JSON.stringify(PROGS[i].days));S.drafts={};S.day=0;S.tab='w';cp=-1;
}
function pick(){
  var h='<p class="mut" style="margin:0 2px 10px">Choose a program. Your saved workouts and charts are not affected.</p>';
  PROGS.forEach(function(p,i){
    h+='<div class="card"><b>'+esc(p.t)+'</b><div class="mut">'+esc(p.d)+'</div><div class="mut" style="margin-top:4px">'+p.days.map(function(d){return esc(d.f)}).join(' · ')+'</div><button class="pri" data-a="usep" data-v="'+i+'" style="margin-top:8px">'+(cp===i?'Tap again to replace your current program':'Use this program')+'</button></div>';
  });
  return h+xcard();
}
var pend=null,pmsg='';
function xcard(){
  return '<div class="card"><b>Import from Excel</b><p class="mut">Choose an .xlsx, .xls or .csv file with one row per set. Required column: Exercise. Optional: Date, Day, Set, Weight, Reps. Finnish headers such as Pvm, Liike, Paino and Toistot also work.</p><p class="mut">Rows with a Date are added to History. Rows without dates become your program: each Day becomes a training day with its exercises in order.</p><input type="file" id="xf" accept=".xlsx,.xls,.csv" style="padding:8px">'+(pmsg?'<p style="margin:8px 0 0">'+esc(pmsg)+'</p>':'')+(pend?'<button class="pri" data-a="xapply">Apply import</button>':'')+'</div>';
}
function loadX(cb){
  if(window.XLSX)return cb();
  var s=document.createElement('script');s.src='xlsx.full.min.js';
  s.onload=cb;s.onerror=function(){pmsg='Could not load the Excel reader. Reload the app and try again.';render()};
  document.head.appendChild(s);
}
function col(keys,al){for(var i=0;i<keys.length;i++){if(al.indexOf(String(keys[i]).toLowerCase().trim())>=0)return keys[i]}return null}
function pdate(v){
  if(v instanceof Date){if(isNaN(v))return null;var x=new Date(v.getTime()+432e5);return new Date(x.getFullYear(),x.getMonth(),x.getDate(),12)}
  var s=String(v).trim(),m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})$/);
  if(m)return new Date(+m[3],+m[2]-1,+m[1],12);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3],12);
  return null;
}
function parseX(buf){
  var wb=XLSX.read(buf,{type:'array',cellDates:true}),hist=[],prog=[],hk={},pk={};
  wb.SheetNames.forEach(function(sn){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:''});if(!rows.length)return;
    var keys=Object.keys(rows[0]),cE=col(keys,['exercise','liike','harjoitus']),cD=col(keys,['date','pvm','päivämäärä']),cW=col(keys,['day','workout','focus','treeni','päivä']),cK=col(keys,['weight','kg','paino']),cR=col(keys,['reps','toistot','toisto']);
    if(!cE)return;
    rows.forEach(function(r){
      var name=String(r[cE]).trim();if(!name)return;
      var day=String(cW?r[cW]:'').trim()||sn,d=cD?pdate(r[cD]):null,w=cK?String(r[cK]).trim():'',rp=cR?String(r[cR]).trim():'';
      if(d){
        if(w===''&&rp==='')return;
        var t=d.getTime(),key=t+'|'+day,ss=hk[key];
        if(!ss){ss=hk[key]={t:t,f:day,items:[]};hist.push(ss)}
        var it=ss.items.filter(function(x){return x.name===name})[0];
        if(!it){it={name:name,sets:[]};ss.items.push(it)}
        it.sets.push({w:w,r:rp});
      }else{
        var p=pk[day];if(!p){p=pk[day]={f:day,n:'',ex:[]};prog.push(p)}
        if(p.ex.indexOf(name)<0)p.ex.push(name);
      }
    });
  });
  if(hist.length){
    var sets=0;hist.forEach(function(s){s.items.forEach(function(i){sets+=i.sets.length})});
    hist.sort(function(a,b){return a.t-b.t});
    return {p:{hist:hist,prog:[]},msg:'Found '+hist.length+' workouts and '+sets+' sets, '+dt(hist[0].t)+' to '+dt(hist[hist.length-1].t)+'. They will be added to History.'};
  }
  if(prog.length)return {p:{hist:[],prog:prog},msg:'Found '+prog.length+' training days: '+prog.map(function(x){return x.f}).join(', ')+'. This replaces your current program.'};
  return {msg:'No usable rows found. Check that the file has an Exercise column.'};
}
function applyX(){
  if(!pend)return;
  if(pend.hist.length){
    var have={};S.sessions.forEach(function(s){have[new Date(s.t).toDateString()+'|'+s.f]=1});
    pend.hist.forEach(function(s){if(!have[new Date(s.t).toDateString()+'|'+s.f])S.sessions.push(s)});
    S.sessions.sort(function(a,b){return a.t-b.t});S.tab='h';
  }else{S.days=pend.prog;S.drafts={};S.day=0;S.tab='w'}
  pend=null;pmsg='';save();
}
app.addEventListener('change',function(e){
  if(e.target.id==='pe'){S.pex=e.target.value;save();render()}
  else if(e.target.id==='xf'){
    var f=e.target.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){loadX(function(){
      try{var r=parseX(rd.result);pend=r.p||null;pmsg=r.msg}catch(x){pend=null;pmsg='Could not read that file.'}
      render();
    })};
    rd.onerror=function(){pend=null;pmsg='Could not read that file.';render()};
    rd.readAsArrayBuffer(f);
  }
});
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script></body></html>
